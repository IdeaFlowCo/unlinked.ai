name: unlinked-private-guest-pilot-20261001
services:
  graph:
    image: ${PILOT_NEO4J_IMAGE:?approved digest-pinned image required}
    container_name: unlinked-private-guest-pilot-20261001-graph
    user: ${PILOT_UID:?explicit host operator uid required}:${PILOT_GID:?explicit host operator gid required}
    # Preserve tini signal forwarding and the pinned image entrypoint; only tighten creation modes.
    entrypoint: [tini, -g, --, /bin/bash, -c, "umask 077; exec /startup/docker-entrypoint.sh neo4j"]
    command: []
    env_file: /srv/unlinked-private-guest-pilot-20261001/runtime/graph.env
    environment:
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_http_enabled: 'false'
      NEO4J_server_https_enabled: 'false'
    networks: [backend]
    volumes:
      - type: bind
        source: /srv/unlinked-private-guest-pilot-20261001/neo4j-data
        target: /data
        bind: {create_host_path: false}
    mem_limit: 1g
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging: {driver: none}
    labels: {unlinked.private-pilot.root: /srv/unlinked-private-guest-pilot-20261001}
  runtime:
    image: ${PILOT_RUNTIME_IMAGE:?approved dependency-complete image required}
    container_name: unlinked-private-guest-pilot-20261001-runtime
    user: ${PILOT_UID:?explicit host operator uid required}:${PILOT_GID:?explicit host operator gid required}
    networks: [frontend, backend]
    read_only: true
    env_file: /srv/unlinked-private-guest-pilot-20261001/runtime/runtime.env
    environment:
      PILOT_ROOT: /srv/unlinked-private-guest-pilot-20261001
      PILOT_ORIGIN: https://private.unlinked.ai
      PILOT_DATA_MODE: private_live
      PILOT_HOST: 0.0.0.0
      PILOT_NETWORK_MODE: isolated-container
      PILOT_PORT: '9367'
      PILOT_OPERATIONS_URL: http://127.0.0.1:9022
      PILOT_BOLT_URL: bolt://graph:7687
    command: [node, /release/runtime.mjs]
    volumes:
      - type: bind
        source: /srv/unlinked-private-guest-pilot-20261001/runtime
        target: /srv/unlinked-private-guest-pilot-20261001/runtime
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /srv/unlinked-private-guest-pilot-20261001/assets
        target: /srv/unlinked-private-guest-pilot-20261001/assets
        bind: {create_host_path: false}
      - type: bind
        source: /srv/unlinked-private-guest-pilot-20261001/audit
        target: /srv/unlinked-private-guest-pilot-20261001/audit
        bind: {create_host_path: false}
      - type: bind
        source: .
        target: /release
        read_only: true
        bind: {create_host_path: false}
    # Docker otherwise creates the unmounted parent as root:root 755.
    # This private parent is ephemeral; explicit child binds retain all state.
    tmpfs:
      - '/srv/unlinked-private-guest-pilot-20261001:mode=700,uid=${PILOT_UID:?explicit host operator uid required},gid=${PILOT_GID:?explicit host operator gid required}'
      - '/tmp:mode=700,uid=${PILOT_UID:?explicit host operator uid required},gid=${PILOT_GID:?explicit host operator gid required}'
    mem_limit: 1g
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging: {driver: none}
    labels: {unlinked.private-pilot.root: /srv/unlinked-private-guest-pilot-20261001}
  ingress:
    image: ${PILOT_NGINX_IMAGE:?approved digest-pinned image required}
    container_name: unlinked-private-guest-pilot-20261001-ingress
    networks: [frontend]
    ports: ['443:8443']
    user: ${PILOT_UID:?explicit host operator uid required}:${PILOT_GID:?explicit host operator gid required}
    read_only: true
    entrypoint: [nginx, -g, 'daemon off;']
    volumes:
      - type: bind
        source: ./nginx.conf
        target: /etc/nginx/nginx.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /srv/unlinked-private-guest-pilot-20261001/runtime/tls
        target: /tls
        read_only: true
        bind: {create_host_path: false}
    tmpfs: ['/tmp:mode=700,uid=${PILOT_UID:?explicit host operator uid required},gid=${PILOT_GID:?explicit host operator gid required}']
    mem_limit: 128m
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    logging: {driver: none}
    labels: {unlinked.private-pilot.root: /srv/unlinked-private-guest-pilot-20261001}

networks:
  frontend: {}
  backend: {internal: true}
