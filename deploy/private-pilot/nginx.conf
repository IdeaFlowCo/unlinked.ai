pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 128; }
http {
  # Invitation URLs and query strings never enter access/error logs.
  access_log off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 65m;
  # Published profile photos send their own content-versioned Cache-Control
  # (docs/profile-photos.md); every other response stays no-store. An empty
  # value makes add_header send nothing.
  map $uri $unlinked_cache_control {
    ~^/people/[^/]+/photo$ "";
    default no-store;
  }
  server {
    listen 8443 ssl;
    server_name private.unlinked.ai;
    ssl_certificate /tls/fullchain.pem;
    ssl_certificate_key /tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    if ($http_host !~ "^private\.unlinked\.ai(:443)?$") { return 444; }
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header Referrer-Policy strict-origin always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control $unlinked_cache_control always;
    location ~ ^/(unlinked|assets|ops|query|db)(/|$) { return 404; }
    location / {
      proxy_pass http://runtime:9367;
      proxy_set_header Host private.unlinked.ai;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_connect_timeout 5s;
      proxy_read_timeout 180s;
      proxy_buffering off;
    }
  }
}
