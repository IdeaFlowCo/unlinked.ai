name: Source CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source:
    # This repository is public. Fork code runs only on disposable hosted runners.
    # Pin the hosted image after ubuntu-latest failed to acquire a runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            mcp-server/package-lock.json
      - name: Install locked web dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install locked MCP dependencies
        working-directory: mcp-server
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify MCP runtime dependencies
        working-directory: mcp-server
        run: node --input-type=module -e "await import('@modelcontextprotocol/sdk/client/index.js')"
      - name: Verify optional private browser and grant runtime dependencies
        shell: bash
        run: |
          if [[ -f mcp-server/private-browser.mjs ]]; then
            node --input-type=module -e "await Promise.all([import('./mcp-server/private-browser.mjs'), import('./mcp-server/private-grants.mjs'), import('./mcp-server/private-hosted.mjs')])"
          fi
      - name: Run executable web and private OIDC/grant tests
        run: npm test
      - name: Compile MCP server
        working-directory: mcp-server
        run: npm run build
      - name: Verify private deployment consumer contracts
        run: |
          python3 deploy/private-pilot/checks.py
          python3 deploy/private-pilot/topology-check.py
  graph-migration:
    # Public PRs use disposable hosted databases and synthetic credentials only.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      source-graph:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/unlinked-s21-fixture
        ports: ['8967:7687']
        options: >-
          --health-cmd "cypher-shell -u neo4j -p unlinked-s21-fixture 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 20
      target-graph:
        image: neo4j:5.15-community
        env:
          NEO4J_AUTH: neo4j/unlinked-s21-fixture
        ports: ['8968:7687']
        options: >-
          --health-cmd "cypher-shell -u neo4j -p unlinked-s21-fixture 'RETURN 1'"
          --health-interval 10s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install locked application test dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix mcp-server ci --ignore-scripts --no-audit --no-fund
      - name: Install existing compatible driver into disposable test harness
        run: npm install --prefix "$RUNNER_TEMP/unlinked-migration-driver" --ignore-scripts --no-audit --no-fund --save-exact neo4j-driver@5.28.3
      - name: Exercise cross-version migration, activation fence and reverse recovery
        env:
          UNLINKED_MIGRATION_TEST: isolated-fixture
          MIGRATION_NEO4J_MODULE_ROOT: ${{ runner.temp }}/unlinked-migration-driver
        run: node --test tests/graph-migration.integration.test.mjs
